name: Windows packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/test-publication.mjs
      - run: node scripts/check-publication.mjs
      - name: Check version tag
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'asprite-mcp' }).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version must match.' }
      - run: cargo test --workspace --locked
      - name: Build Windows packages
        shell: powershell
        run: .\scripts\build-windows.ps1 -BootstrapInno
      - name: Check Windows installer
        shell: powershell
        run: .\scripts\test-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-pixel-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-pixel-windows
          path: dist
      - name: Verify published checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "docs/releases/$GITHUB_REF_NAME.md"; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "Rust Pixel Bridge $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "Rust Pixel Bridge $GITHUB_REF_NAME" --generate-notes
          fi
